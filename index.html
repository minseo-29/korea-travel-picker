<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 국내 여행지 추천 🐣</title>
<script defer src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=3o1m3xmrv8&submodules=geocoder"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --pink: #ff6f9c;
  }
  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #ffe4f0 0%, #ffe9c7 45%, #d9f2ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.6s ease;
  }
  body.season-spring { background: linear-gradient(135deg, #ffe0ec 0%, #fff0e6 50%, #e8ffe8 100%); }
  body.season-summer { background: linear-gradient(135deg, #d8f6ff 0%, #e2fff2 50%, #fffbe0 100%); }
  body.season-autumn { background: linear-gradient(135deg, #ffe6cf 0%, #fff0c9 50%, #ffdede 100%); }
  body.season-winter { background: linear-gradient(135deg, #e7f0ff 0%, #f2f6ff 50%, #eef2ff 100%); }

  .card {
    background: #fffdfa;
    border-radius: 32px;
    box-shadow: 0 14px 0 #ffd6e8, 0 20px 40px rgba(255, 150, 190, 0.25);
    border: 3px solid #ffffff;
    padding: 32px 28px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .top-row { display:flex; justify-content: space-between; align-items:center; margin-bottom: 4px; }
  .fav-open-btn {
    border: none; background: #fff0f6; color:#ff6f9c; font-weight:700; font-size:12px;
    padding: 8px 14px; border-radius: 999px; cursor:pointer;
  }
  .emoji-title {
    font-size: 40px;
    display: inline-block;
    animation: wiggle 2.4s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  h1 {
    font-size: 21px;
    color: #ff6f9c;
    margin: 6px 0 4px;
    font-weight: 800;
  }
  p.sub {
    color: #9a8a99;
    font-size: 12.5px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .selects { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
  select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 999px;
    border: 2px solid #ffd7e8;
    font-size: 14px;
    background: #fff6fa;
    color: #7a5c6e;
    font-weight: 600;
    appearance: none;
    text-align: center;
  }
  select:focus { outline: none; border-color: #ff9fc0; }

  button.main-btn {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff9fc0, #ffb6d9);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #ff7fa8;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button.main-btn:hover { filter: brightness(1.03); }
  button.main-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #ff7fa8; }

  .result {
    margin-top: 22px;
    padding: 20px;
    border-radius: 24px;
    background: #fff4f8;
    border: 2px dashed #ffc3dc;
    display: none;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .season-spring .result { background: #fff0f6; border-color: #ffb3c6; }
  .season-summer .result { background: #eafcff; border-color: #7fd8ff; }
  .season-autumn .result { background: #fff3e6; border-color: #ffb066; }
  .season-winter .result { background: #f0f5ff; border-color: #a9c6ff; }

  .result.show { display: block; animation: pop 0.35s ease; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(0.85) translateY(8px); }
    60% { opacity: 1; transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  .result-head { display:flex; justify-content:center; align-items:center; gap:10px; }
  .fav-star {
    border:none; background:transparent; font-size:22px; cursor:pointer; line-height:1;
    filter: grayscale(1) opacity(0.5);
  }
  .fav-star.active { filter:none; }

  .tags { margin: 10px 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #ff6f9c;
    background: #ffe3ee;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .tag.theme { color: #2ba884; background: #e0f8ee; }
  .tag.month { color: #7d6cff; background: #ece8ff; }
  .tag.companion { color: #b8860b; background: #fff3d6; }

  .name {
    font-size: 26px;
    font-weight: 800;
    color: #4a3a45;
    margin-bottom: 6px;
  }
  .desc {
    font-size: 13.5px;
    color: #8a7a85;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .note {
    margin-top: 10px;
    font-size: 12px;
    color: #e2a13a;
    font-weight: 700;
  }

  .map-wrap { margin-top: 14px; }
  .map-wrap #naverMap {
    width: 100%; height: 180px; border-radius: 16px; background: #eef2f7;
  }
  .map-links, .nearby-links, .share-links {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px;
  }
  .pill-link {
    font-size: 11.5px; font-weight: 700; text-decoration: none;
    padding: 7px 12px; border-radius: 999px; background: #fff; border: 1.5px solid #ffd7e8;
    color: #7a5c6e; cursor: pointer;
  }
  .pill-link:hover { background: #fff0f6; }

  .section-label {
    font-size: 12px; font-weight: 800; color: #4a3a45; margin: 16px 0 6px; text-align: left;
  }
  .hint { font-size: 10.5px; color: #b7a8c2; margin-top: 4px; }

  .stats {
    margin-top: 20px;
    padding: 14px;
    border-radius: 20px;
    background: #f3f0ff;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }
  .stats .stat b { display: block; font-size: 17px; color: #7d6cff; }
  .stats .stat span { font-size: 10.5px; color: #9a8fcf; }
  .count { font-size: 11px; color: #b7a8c2; margin-top: 12px; }

  .fav-panel {
    display:none; margin-top: 16px; padding: 16px; border-radius: 20px;
    background: #fbf7ff; border: 2px solid #ece5ff; text-align:left;
  }
  .fav-panel.show { display:block; }
  .fav-panel h3 { margin:0 0 8px; font-size:13px; color:#7d6cff; }
  .fav-item { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #e6ddff; font-size:13px; color:#4a3a45; }
  .fav-item button { border:none; background:none; cursor:pointer; font-size:12px; color:#ff6f9c; font-weight:700; }
  .fav-empty { font-size:12px; color:#b7a8c2; }
</style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <div></div>
      <button class="fav-open-btn" onclick="toggleFavPanel()">⭐ 즐겨찾기</button>
    </div>
    <div class="emoji-title">🐣🗺️🐰</div>
    <h1>랜덤 국내 여행지 뽑기</h1>
    <p class="sub">전국 방방곡곡, 누구랑 언제 가는지까지 골라서<br>오늘의 여행지를 콕! 뽑아드려요</p>

    <div class="selects">
      <select id="region">
        <option value="all">🌏 전체 지역</option>
        <option value="서울">서울</option>
        <option value="인천">인천</option>
        <option value="경기">경기도</option>
        <option value="강원">강원특별자치도</option>
        <option value="충북">충청북도</option>
        <option value="충남">충청남도</option>
        <option value="대전">대전</option>
        <option value="세종">세종</option>
        <option value="전북">전북특별자치도</option>
        <option value="전남">전라남도</option>
        <option value="광주">광주</option>
        <option value="경북">경상북도</option>
        <option value="경남">경상남도</option>
        <option value="대구">대구</option>
        <option value="울산">울산</option>
        <option value="부산">부산</option>
        <option value="제주">제주특별자치도</option>
      </select>

      <select id="theme">
        <option value="all">✨ 전체 테마</option>
        <option value="바다">🌊 바다 / 해변</option>
        <option value="산">⛰️ 산 / 자연</option>
        <option value="도시">🏙️ 도시</option>
        <option value="섬">🏝️ 섬</option>
        <option value="힐링">♨️ 힐링 / 온천</option>
        <option value="역사">🏯 역사 / 전통</option>
        <option value="미식">🍜 미식 / 맛집</option>
        <option value="축제">🎉 축제 / 이벤트</option>
        <option value="액티비티">🚵 액티비티 / 체험</option>
        <option value="카페">☕ 카페 / 감성</option>
      </select>

      <select id="month">
        <option value="all">📅 전체 시기</option>
        <option value="1">1월 ❄️</option><option value="2">2월 ❄️</option>
        <option value="3">3월 🌸</option><option value="4">4월 🌸</option>
        <option value="5">5월 🌿</option><option value="6">6월 🌿</option>
        <option value="7">7월 ☀️</option><option value="8">8월 ☀️</option>
        <option value="9">9월 🍁</option><option value="10">10월 🍁</option>
        <option value="11">11월 🍂</option><option value="12">12월 ⛄</option>
      </select>

      <select id="companion">
        <option value="all">👥 누구와 함께?</option>
        <option value="연인">💑 연인</option>
        <option value="아이">🧒 아이와 함께</option>
        <option value="친구">🧑‍🤝‍🧑 친구</option>
        <option value="부모님">👨‍👩‍🧒 부모님과 함께</option>
        <option value="회사">💼 회사 / 워크샵</option>
      </select>
    </div>

    <button class="main-btn" onclick="pickDestination()">🎲 여행지 뽑기</button>

    <div class="result" id="result">
      <div class="result-head">
        <div class="name" id="name"></div>
        <button class="fav-star" id="favStar" onclick="toggleFavorite()">★</button>
      </div>
      <div class="tags">
        <span class="tag" id="region-tag"></span>
        <span class="tag theme" id="theme-tags"></span>
        <span class="tag month" id="month-tags"></span>
        <span class="tag companion" id="companion-tags"></span>
      </div>
      <div class="desc" id="desc"></div>
      <div class="note" id="note"></div>

      <div class="section-label">🗺️ 지도로 보기 (네이버지도)</div>
      <div class="map-wrap">
        <div id="naverMap"></div>
      </div>
      <div class="map-links" id="mapLinks"></div>

      <div class="section-label">🍜 주변 정보 (실시간 지도 검색으로 연결돼요)</div>
      <div class="nearby-links" id="nearbyLinks"></div>
      <div class="hint">※ 맛집·카페 정보는 자주 바뀌어서, 정확한 최신 정보를 위해 직접 지도앱에서 확인하도록 링크로 연결했어요.</div>

      <div class="section-label">📤 결과 공유</div>
      <div class="share-links">
        <button class="pill-link" onclick="copyShareLink()">🔗 링크 복사</button>
        <button class="pill-link" onclick="shareResult()">📱 공유하기 (카카오톡/문자)</button>
      </div>
    </div>

    <div class="fav-panel" id="favPanel">
      <h3>⭐ 내 즐겨찾기</h3>
      <div id="favList"></div>
    </div>

    <div class="stats">
      <div class="stat"><b>17</b><span>광역자치단체</span></div>
      <div class="stat"><b>85</b><span>전국 시 전체</span></div>
      <div class="stat"><b>75</b><span>도 산하 자치시</span></div>
    </div>
    <div class="count" id="count"></div>
  </div>

<script>
// themes: 바다, 산, 도시, 섬, 힐링, 역사, 미식, 축제, 액티비티, 카페
const destinations = [
  { name: "서울", region: "서울", themes: ["도시","카페","미식"], months: [4,5,9,10], desc: "경복궁, 북촌한옥마을부터 한강, 성수동까지 전통과 트렌드가 공존하는 수도." },
  { name: "인천 차이나타운", region: "인천", themes: ["도시","미식"], months: [3,4,5,9,10,11], desc: "짜장면의 발상지이자 이국적인 거리 풍경이 매력적인 개항의 도시." },
  { name: "강화도", region: "인천", themes: ["섬","역사"], months: [4,5,9,10], desc: "고인돌 유적과 마니산, 갯벌 낙조로 유명한 역사와 자연의 섬." },
  { name: "수원", region: "경기", themes: ["역사","도시"], months: [4,5,9,10], desc: "유네스코 세계유산 수원화성과 행궁동 거리가 있는 역사 도시." },
  { name: "가평", region: "경기", themes: ["힐링","액티비티"], months: [4,5,10,11,1,12], desc: "남이섬, 아침고요수목원 등 서울 근교 힐링 여행의 대표지." },
  { name: "파주", region: "경기", themes: ["힐링","카페"], months: [4,5,9,10], desc: "임진각과 헤이리예술마을, 프로방스마을이 있는 문화 여행지." },
  { name: "포천", region: "경기", themes: ["산","액티비티"], months: [7,8,10], desc: "산정호수와 한탄강 협곡으로 유명한 자연 명소." },
  { name: "이천", region: "경기", themes: ["미식","카페"], months: [4,5,9,10], desc: "도자기 축제와 쌀밥정식으로 유명한 공예·미식 도시." },
  { name: "양평", region: "경기", themes: ["힐링","카페"], months: [4,5,9,10], desc: "두물머리 물안개와 감성 카페거리로 유명한 힐링 여행지." },
  { name: "안성", region: "경기", themes: ["역사","미식"], months: [4,5,9,10], desc: "안성맞춤랜드와 전통시장으로 유명한 경기 남부 도시." },
  { name: "동두천", region: "경기", themes: ["산","액티비티"], months: [9,10], desc: "소요산 단풍과 자유수호평화박물관으로 알려진 도시." },
  { name: "강릉", region: "강원", themes: ["바다","카페"], months: [6,7,8,9], desc: "경포대, 안목해변 커피거리로 유명한 동해안 대표 여행지." },
  { name: "속초", region: "강원", themes: ["바다","산"], months: [7,8,1,2], desc: "설악산과 동해 바다를 동시에 즐길 수 있는 강원도 대표 관광지." },
  { name: "춘천", region: "강원", themes: ["힐링","미식"], months: [9,10,1,2], desc: "닭갈비와 소양강, 남이섬 인근으로 유명한 감성 도시." },
  { name: "정선", region: "강원", themes: ["산","액티비티"], months: [9,10,11], desc: "화암동굴과 레일바이크로 유명한 강원도 산간 여행지." },
  { name: "평창", region: "강원", themes: ["산","액티비티"], months: [6,7,8,1,2], desc: "대관령 양떼목장과 오대산으로 유명한 고원 여행지." },
  { name: "양양", region: "강원", themes: ["바다","액티비티"], months: [6,7,8], desc: "서핑의 성지로 떠오른 젊고 트렌디한 해변 마을." },
  { name: "홍천", region: "강원", themes: ["산","힐링"], months: [10,11], desc: "은행나무숲과 계곡으로 유명한 자연 속 힐링 여행지." },
  { name: "설악산", region: "강원", themes: ["산","액티비티"], months: [9,10,11], desc: "가을 단풍과 울산바위로 유명한 강원도의 명산." },
  { name: "삼척", region: "강원", themes: ["바다","산"], months: [7,8,9,10], desc: "해수욕장과 환선굴로 유명한 동해안 자연 여행지." },
  { name: "고성", region: "강원", themes: ["바다","산"], months: [7,8], desc: "청정 해변과 통일전망대로 유명한 강원 최북단 여행지." },
  { name: "인제", region: "강원", themes: ["산","액티비티"], months: [6,7,8,9,10], desc: "내린천 래프팅과 원대리 자작나무숲으로 유명한 산간 여행지." },
  { name: "제천", region: "충북", themes: ["힐링","산"], months: [4,5,9,10], desc: "청풍호와 의림지 등 잔잔한 호수 풍경이 아름다운 힐링 스팟." },
  { name: "청주", region: "충북", themes: ["도시","역사"], months: [4,5,9,10], desc: "직지의 고장이자 상당산성으로 유명한 충북 대표 도시." },
  { name: "단양", region: "충북", themes: ["산","액티비티"], months: [7,8,9,10], desc: "단양팔경과 고수동굴 등 절경으로 유명한 자연 명소." },
  { name: "보은", region: "충북", themes: ["산","역사"], months: [4,5,9,10], desc: "속리산과 법주사로 유명한 충북의 대표 명산 여행지." },
  { name: "옥천", region: "충북", themes: ["힐링","카페"], months: [4,5,9,10], desc: "정지용 생가와 대청호 둘레길로 유명한 조용한 힐링 여행지." },

// 테마 -> 추천 동행 매핑 (동행 필터는 여기서 자동으로 계산돼요)
const themeToCompanions = {
  바다: ["연인","친구","아이"],
  산: ["친구","회사","부모님"],
  도시: ["친구","회사","연인"],
  섬: ["연인","아이"],
  힐링: ["부모님","연인"],
  역사: ["아이","부모님"],
  미식: ["친구","연인"],
  축제: ["친구","연인"],
  액티비티: ["친구","아이"],
  카페: ["연인","친구"]
};
function getCompanions(d) {
  const set = new Set();
  d.themes.forEach(t => (themeToCompanions[t] || []).forEach(c => set.add(c)));
  return [...set];
}

const monthNames = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
function getSeason(m) {
  if ([3,4,5].includes(m)) return { key: "spring", label: "봄", emoji: "🌸" };
  if ([6,7,8].includes(m)) return { key: "summer", label: "여름", emoji: "☀️" };
  if ([9,10,11].includes(m)) return { key: "autumn", label: "가을", emoji: "🍁" };
  return { key: "winter", label: "겨울", emoji: "⛄" };
}

document.getElementById('count').textContent = `🐾 등록된 여행지 총 ${destinations.length}곳 (전국 17개 시·도 · 테마 10종 · 동행 5종 · 월별 반영)`;

function buildPool(c) {
  return destinations.filter(d => {
    if (c.region && d.region !== c.region) return false;
    if (c.theme && !d.themes.includes(c.theme)) return false;
    if (c.month && !d.months.includes(c.month)) return false;
    if (c.companion && !getCompanions(d).includes(c.companion)) return false;
    return true;
  });
}

let currentPick = null;

function pickDestination() {
  const regionVal = document.getElementById('region').value;
  const themeVal = document.getElementById('theme').value;
  const monthVal = document.getElementById('month').value;
  const companionVal = document.getElementById('companion').value;

  let constraints = {
    region: regionVal !== 'all' ? regionVal : null,
    theme: themeVal !== 'all' ? themeVal : null,
    month: monthVal !== 'all' ? parseInt(monthVal, 10) : null,
    companion: companionVal !== 'all' ? companionVal : null
  };

  let pool = buildPool(constraints);
  let note = '';
  const dropOrder = ['companion', 'month', 'theme', 'region'];
  let i = 0;
  while (pool.length === 0 && i < dropOrder.length) {
    const key = dropOrder[i];
    if (constraints[key]) {
      constraints = { ...constraints, [key]: null };
      pool = buildPool(constraints);
      note = '🙈 조건에 딱 맞는 곳이 없어서 일부 조건을 완화해 추천했어요!';
    }
    i++;
  }
  if (pool.length === 0) {
    pool = destinations;
    note = '🙈 조건에 맞는 곳이 없어서 전국에서 랜덤으로 뽑았어요!';
  }

  const pick = pool[Math.floor(Math.random() * pool.length)];
  const effectiveMonth = constraints.month || pick.months[0];
  renderResult(pick, note, effectiveMonth);
}

// ---------- 네이버 지도 ----------
let naverMapInstance = null;
let naverMarker = null;
function ensureNaverMap() {
  if (!naverMapInstance && window.naver && naver.maps) {
    naverMapInstance = new naver.maps.Map('naverMap', {
      center: new naver.maps.LatLng(36.5, 127.8),
      zoom: 7
    });
  }
  return naverMapInstance;
}
function updateNaverMap(query) {
  if (!window.naver || !naver.maps || !naver.maps.Service) {
    // 스크립트가 아직 로드 전이면 잠시 후 재시도
    setTimeout(() => updateNaverMap(query), 300);
    return;
  }
  const map = ensureNaverMap();
  naver.maps.Service.geocode({ query }, function (status, response) {
    if (status !== naver.maps.Service.Status.OK) return;
    const addresses = response.v2.addresses;
    if (!addresses || addresses.length === 0) return;
    const item = addresses[0];
    const point = new naver.maps.LatLng(item.y, item.x);
    map.setCenter(point);
    map.setZoom(12);
    if (naverMarker) naverMarker.setMap(null);
    naverMarker = new naver.maps.Marker({ position: point, map });
  });
}

function renderResult(pick, note, effectiveMonth) {
  currentPick = pick;
  const season = getSeason(effectiveMonth || pick.months[0]);
  document.body.className = 'season-' + season.key;

  document.getElementById('name').textContent = '🎈 ' + pick.name;
  document.getElementById('region-tag').textContent = '📍 ' + (regionNames[pick.region] || pick.region);
  document.getElementById('theme-tags').textContent = pick.themes.join(' · ');
  document.getElementById('month-tags').textContent = season.emoji + ' ' + season.label + ' 추천 · ' + pick.months.map(m => monthNames[m-1]).join(', ');
  document.getElementById('companion-tags').textContent = '👥 ' + getCompanions(pick).join(' · ');
  document.getElementById('desc').textContent = pick.desc;
  document.getElementById('note').textContent = note || '';

  const mapQuery = pick.name + ' ' + (regionNames[pick.region] || '');
  const mapQueryEnc = encodeURIComponent(mapQuery);
  updateNaverMap(mapQuery);
  document.getElementById('mapLinks').innerHTML = `
    <a class="pill-link" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${mapQueryEnc}">카카오맵</a>
    <a class="pill-link" target="_blank" rel="noopener" href="https://map.naver.com/v5/search/${mapQueryEnc}">네이버지도(새 탭)</a>
    <a class="pill-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${mapQueryEnc}">구글지도</a>
  `;

  document.getElementById('nearbyLinks').innerHTML = `
    <a class="pill-link" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${encodeURIComponent(pick.name + ' 맛집')}">🍜 주변 맛집</a>
    <a class="pill-link" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${encodeURIComponent(pick.name + ' 카페')}">☕ 주변 카페</a>
    <a class="pill-link" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${encodeURIComponent(pick.name + ' 가볼만한곳')}">🎡 놀거리 / 가볼만한 곳</a>
  `;

  updateFavStar();
  document.getElementById('result').classList.add('show');
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ---------- 즐겨찾기 (이 브라우저에만 저장돼요) ----------
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('kr_travel_favorites') || '[]'); }
  catch (e) { return []; }
}
function saveFavorites(list) {
  localStorage.setItem('kr_travel_favorites', JSON.stringify(list));
}
function toggleFavorite() {
  if (!currentPick) return;
  let favs = getFavorites();
  if (favs.includes(currentPick.name)) {
    favs = favs.filter(n => n !== currentPick.name);
  } else {
    favs.push(currentPick.name);
  }
  saveFavorites(favs);
  updateFavStar();
  renderFavList();
}
function updateFavStar() {
  const favs = getFavorites();
  const star = document.getElementById('favStar');
  if (currentPick && favs.includes(currentPick.name)) star.classList.add('active');
  else star.classList.remove('active');
}
function toggleFavPanel() {
  const panel = document.getElementById('favPanel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) renderFavList();
}
function renderFavList() {
  const favs = getFavorites();
  const box = document.getElementById('favList');
  if (favs.length === 0) {
    box.innerHTML = '<div class="fav-empty">아직 즐겨찾기한 여행지가 없어요. 결과 옆 별⭐을 눌러보세요!</div>';
    return;
  }
  box.innerHTML = favs.map(name => `
    <div class="fav-item">
      <span>${name}</span>
      <span>
        <button onclick="showFavorite('${name}')">보기</button>
        <button onclick="removeFavorite('${name}')">삭제</button>
      </span>
    </div>
  `).join('');
}
function showFavorite(name) {
  const d = destinations.find(x => x.name === name);
  if (d) renderResult(d, '⭐ 즐겨찾기에서 불러왔어요!', d.months[0]);
}
function removeFavorite(name) {
  saveFavorites(getFavorites().filter(n => n !== name));
  renderFavList();
  updateFavStar();
}

// ---------- 공유하기 ----------
function buildShareUrl() {
  if (!currentPick) return location.href;
  const url = new URL(location.href);
  url.search = '';
  url.searchParams.set('n', currentPick.name);
  return url.toString();
}
function copyShareLink() {
  const url = buildShareUrl();
  navigator.clipboard.writeText(url).then(() => {
    alert('링크를 복사했어요! 카카오톡이나 문자에 붙여넣기 해보세요 📋');
  }).catch(() => {
    prompt('이 링크를 복사해주세요:', url);
  });
}
function shareResult() {
  if (!currentPick) return;
  const url = buildShareUrl();
  if (navigator.share) {
    navigator.share({
      title: '오늘의 여행지: ' + currentPick.name,
      text: currentPick.desc,
      url
    }).catch(() => {});
  } else {
    copyShareLink();
  }
}

// 공유 링크로 들어왔으면 자동으로 결과 보여주기
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const sharedName = params.get('n');
  if (sharedName) {
    const found = destinations.find(d => d.name === sharedName);
    if (found) renderResult(found, '📬 공유받은 여행지예요!', found.months[0]);
  }
  renderFavList();
});
</script>
</body>
